          <p>Designed & Engineered by <a href="https://taufiqu.vercel.app/" style="color: #60a5fa;">Taufiqu</a>. Source code available on <a href="https://github.com/Taufiqu/document-tools" style="color: #60a5fa;">GitHub</a>.</p>
          <p>DocuCraft is a comprehensive, client-side web suite for manipulating PDFs, images, and scanned documents 100% locally in browser memory without transmitting files to remote servers.</p>
          <h2>Available Client-Side Tools:</h2>
          <ul>
            <li><strong>CamScanner Camera:</strong> Live document capture with 4-corner perspective warping, Magic Color filter, and multi-page PDF compilation.</li>

            <li><strong>Images to PDF:</strong> Convert photos into scanned PDF documents with realistic photocopy and grayscale filters.</li>
            <li><strong>PNG to JPG Converter:</strong> Batch convert PNGs with custom background fills for transparent channels.</li>
            <li><strong>PDF to Images:</strong> Render PDF pages into high-resolution PNG or JPG images with single-page and ZIP downloads.</li>
            <li><strong>Page Numbering:</strong> Stamp headers and footers with custom positions and Arabic/Roman numbering.</li>
            <li><strong>Grayscale PDF:</strong> Convert color PDFs to black & white for printing economy.</li>
            <li><strong>Watermark Studio:</strong> Add customizable diagonal or horizontal text watermarks.</li>
